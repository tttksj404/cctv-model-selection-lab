spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

worker:
  authentication:
    key: ${WORKER_AUTHENTICATION_KEY:${AI_WORKER_API_KEY:}}
    id: ${WORKER_AUTHENTICATION_ID:recording-ai-worker}

eyesonu:
  auth:
    rate-limit-key-secret: ${AUTH_RATE_LIMIT_KEY_SECRET:}
    bootstrap:
      enabled: true
      login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      name: ${ADMIN_BOOTSTRAP_NAME:}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:}
      public-endpoint: ${S3_PUBLIC_ENDPOINT}
      region: ${S3_REGION}
      bucket: ${S3_BUCKET}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      connect-timeout: ${S3_CONNECT_TIMEOUT:3s}
      read-timeout: ${S3_READ_TIMEOUT:5s}
      call-timeout: ${S3_CALL_TIMEOUT:10s}
      max-file-size-bytes: ${RECORDING_MAX_FILE_SIZE_BYTES}
      case-photo-max-file-size-bytes: ${CASE_PHOTO_MAX_FILE_SIZE_BYTES:10485760}
      candidate-image-max-file-size-bytes: ${CANDIDATE_IMAGE_MAX_FILE_SIZE_BYTES:10485760}
      presigned-url-expiry: ${S3_PRESIGNED_URL_EXPIRY:15m}
