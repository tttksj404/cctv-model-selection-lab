spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/eyesonu?serverTimezone=UTC&characterEncoding=UTF-8}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/eyesonu}
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

eyesonu:
  auth:
    rate-limit-key-secret: ${AUTH_RATE_LIMIT_KEY_SECRET:eyesonu-local-rate-limit-key-change-me}
    bootstrap:
      enabled: true
      login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:eyesonu-local-admin!}
      name: ${ADMIN_BOOTSTRAP_NAME:Local Administrator}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:eyesonu-media}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      connect-timeout: ${S3_CONNECT_TIMEOUT:3s}
      read-timeout: ${S3_READ_TIMEOUT:5s}
      call-timeout: ${S3_CALL_TIMEOUT:10s}
      max-file-size-bytes: ${RECORDING_MAX_FILE_SIZE_BYTES:5368709120}
      case-photo-max-file-size-bytes: ${CASE_PHOTO_MAX_FILE_SIZE_BYTES:10485760}
      presigned-url-expiry: ${S3_PRESIGNED_URL_EXPIRY:15m}

# CI/CD 배포 연결 확인용
