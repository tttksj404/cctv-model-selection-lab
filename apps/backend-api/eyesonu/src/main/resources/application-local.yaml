spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/eyesonu?serverTimezone=UTC&characterEncoding=UTF-8}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/eyesonu}
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

server:
  servlet:
    session:
      cookie:
        secure: false

eyesonu:
  auth:
    rate-limit-key-secret: ${AUTH_RATE_LIMIT_KEY_SECRET:eyesonu-local-rate-limit-key-change-me}
    bootstrap:
      enabled: true
      login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:eyesonu-local-admin!}
      name: ${ADMIN_BOOTSTRAP_NAME:Local Administrator}
  storage:
    minio:
      endpoint: ${MINIO_INTERNAL_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      region: ${MINIO_REGION:ap-northeast-2}
      bucket: ${MINIO_BUCKET:eyesonu-media}
      access-key: ${MINIO_APP_ACCESS_KEY:eyesonu-app}
      secret-key: ${MINIO_APP_SECRET_KEY:eyesonu-app-local-secret}
      connect-timeout: ${MINIO_CONNECT_TIMEOUT:3s}
      read-timeout: ${MINIO_READ_TIMEOUT:5s}
      call-timeout: ${MINIO_CALL_TIMEOUT:10s}
      max-file-size-bytes: ${RECORDING_MAX_FILE_SIZE_BYTES:5368709120}
      case-photo-max-file-size-bytes: ${CASE_PHOTO_MAX_FILE_SIZE_BYTES:10485760}
      candidate-image-max-file-size-bytes: ${CANDIDATE_IMAGE_MAX_FILE_SIZE_BYTES:10485760}
      presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:15m}

# CI/CD 배포 연결 확인용
