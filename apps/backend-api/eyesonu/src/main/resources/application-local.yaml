spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/eyesonu?serverTimezone=UTC&characterEncoding=UTF-8}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/eyesonu}
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eyesonu:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:eyesonu-media}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
