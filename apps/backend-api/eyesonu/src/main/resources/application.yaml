spring:
  application:
    name: eyesonu
  profiles:
    default: none
  jackson:
    time-zone: UTC

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: EYESONU_SESSION
        path: /
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:/mappers/*.xml
