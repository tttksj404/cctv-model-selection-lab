spring:
  application:
    name: eyesonu
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  profiles:
    default: none
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: EYESONU_SESSION
        path: /
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:/mappers/*.xml

recording:
  analysis:
    worker-claim-lease-seconds: 300
    retry-delay-buckets-seconds: [5, 15, 30, 60, 300]
    outbox:
      auto-start: true
      claim-lease-seconds: 300
      publish-batch-size: 50
      confirm-timeout: 5s
      confirm-poll-interval: 200ms
      poll-delay-ms: 1000
    lease-recovery:
      auto-start: true
      batch-size: 50
      poll-delay-ms: 60000
    backend-consumer:
      auto-start: false
      queue: recording.analysis.backend.queue
      retry:
        max-attempts: 2
        initial-interval-ms: 1000
        multiplier: 2.0
        max-interval-ms: 10000

camera:
  heartbeat:
    offline-timeout-ms: ${CAMERA_HEARTBEAT_OFFLINE_TIMEOUT_MS:30000}
    status-check-interval-ms: ${CAMERA_HEARTBEAT_STATUS_CHECK_INTERVAL_MS:10000}
