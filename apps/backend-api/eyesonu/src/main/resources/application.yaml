spring:
  application:
    name: eyesonu
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  profiles:
    default: none
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: EYESONU_SESSION
        path: /
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:/mappers/*.xml
