spring:
  application:
    name: eyesonu
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  profiles:
    default: none
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: EYESONU_SESSION
        path: /
        http-only: true
        same-site: lax

mybatis:
  mapper-locations: classpath:/mappers/*.xml

recording:
  analysis:
    outbox:
      claim-lease-seconds: 300

camera:
  heartbeat:
    offline-timeout-ms: ${CAMERA_HEARTBEAT_OFFLINE_TIMEOUT_MS:30000}
    status-check-interval-ms: ${CAMERA_HEARTBEAT_STATUS_CHECK_INTERVAL_MS:10000}
