ns-serif" font-size="11.8px" font-weight="400" fill="#64748B" text-anchor="start">두 값은 모두 속성/CCTV proxy 지표이며 identity Rank-1 후보 검색 수치와 합산하거나 대체할 수 없다. 속성 proxy가 올라도 CCTV proxy가 내려가면 운영 승격 근거가 되지 못한다.</text>
