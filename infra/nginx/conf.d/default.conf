server {
    listen 443 ssl;
    server_name i15a204.p.ssafy.io;
    resolver 127.0.0.11 ipv6=off;

    ssl_certificate /etc/letsencrypt/live/13.125.211.107.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.125.211.107.nip.io/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://host.docker.internal:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
