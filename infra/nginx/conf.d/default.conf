server {
    listen 80;
    server_name 13.125.211.107.nip.io
                reporter-master.13.125.211.107.nip.io
                admin-master.13.125.211.107.nip.io
                reporter-dev.13.125.211.107.nip.io
                admin-dev.13.125.211.107.nip.io
                i15a204.p.ssafy.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name reporter-master.13.125.211.107.nip.io;
    resolver 127.0.0.11 ipv6=off valid=30s;

    ssl_certificate /etc/letsencrypt/live/13.125.211.107.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.125.211.107.nip.io/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location /api/ {
        set $backend_master backend-master:8080;
        proxy_pass http://$backend_master;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $reporter_master reporter-master:80;
        proxy_pass http://$reporter_master;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

