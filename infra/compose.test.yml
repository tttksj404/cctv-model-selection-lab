name: eyesonu-test

services:
  mysql-test:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eyesonu_test
      MYSQL_USER: eyesonu_test
      MYSQL_PASSWORD: eyesonu_test_password
      MYSQL_ROOT_PASSWORD: eyesonu_test_root
      TZ: UTC
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_test_data:
