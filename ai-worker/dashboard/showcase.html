<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="description" content="EyesOnU AI Worker 구역 관제 UI primitive showcase" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23006f9e%22/></svg>" />
    <title>EyesOnU 구역 관제 UI 구성요소</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="showcase-page">
      <h1 class="showcase-title">구역 관제 UI 구성요소</h1>
      <div class="showcase-grid">
        <section class="panel" aria-labelledby="badge-title">
          <div class="section-heading"><div><h2 id="badge-title">상태 배지</h2><p>색과 텍스트를 함께 사용합니다.</p></div></div>
          <div class="inline-group">
            <span class="status-badge mock">모의 데이터</span>
            <span class="status-badge ready">연결 준비</span>
            <span class="status-badge review">검토 필요</span>
            <span class="status-badge rejected">후보 제외</span>
          </div>
        </section>
        <section class="panel" aria-labelledby="decision-title">
          <div class="section-heading"><div><h2 id="decision-title">관리자 판단</h2><p>실제 전송 전 로컬 상태를 확인합니다.</p></div></div>
          <div class="decision-list">
            <button class="decision-option selected confirm" type="button">후보 확정</button>
            <button class="decision-option review" type="button">검토 필요</button>
            <button class="decision-option reject" type="button">후보 제외</button>
          </div>
          <button class="dispatch-button" type="button" disabled>중앙 백엔드 연결 후 전환 가능</button>
        </section>
        <section class="panel" aria-labelledby="zone-title">
          <div class="section-heading"><div><h2 id="zone-title">구역 확률 카드</h2><p>선택·다음 카메라·장애 상태를 함께 표시합니다.</p></div></div>
          <button class="zone-card" type="button" aria-pressed="true" style="--probability-opacity: 0.82">
            <span class="zone-card-header"><span><span class="zone-rank">우선순위 1</span><h3>1구역</h3></span><span class="status-badge review">후보 있음</span></span>
            <span class="probability-row"><strong class="probability-value">54.0%</strong><span class="probability-caption">현재 존재확률</span></span>
            <span class="probability-track"><span class="probability-fill" style="--probability-width: 54%"></span></span>
            <span class="camera-grid">
              <span class="camera-cell next"><span class="camera-cell-header"><strong>1-1</strong><span class="status-badge ready">다음</span></span><small>utility 0.431</small></span>
              <span class="camera-cell"><span class="camera-cell-header"><strong>1-2</strong><span>대기</span></span><small>utility 0.382</small></span>
              <span class="camera-cell"><span class="camera-cell-header"><strong>1-3</strong><span>대기</span></span><small>utility 0.351</small></span>
              <span class="camera-cell unavailable"><span class="camera-cell-header"><strong>1-4</strong><span>장애</span></span><small>분석 제외</small></span>
            </span>
          </button>
        </section>
        <section class="panel" aria-labelledby="state-title">
          <div class="section-heading"><div><h2 id="state-title">데이터 상태</h2><p>비어 있음과 오류도 숨기지 않습니다.</p></div></div>
          <div class="notice"><strong>연결 대기</strong><span>현재 화면은 API 계약과 동일한 모의 응답을 사용합니다.</span></div>
          <div class="notice"><strong>탐지 보장 아님</strong><span>관할 내에서도 사각, 가림, 장애 때문에 모든 탐지를 보장할 수 없습니다.</span></div>
        </section>
      </div>
    </main>
  </body>
</html>
