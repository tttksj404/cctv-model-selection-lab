[project]
name = "qwen3vl-backend"
version = "0.1.0"
description = "Typed candidate-attribute inference boundary for the GPU server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.28,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.basedpyright]
include = ["src"]
exclude = ["src/qwen_backend/providers.py"]
typeCheckingMode = "strict"
reportMissingImports = "none"
reportUnusedFunction = "none"
